name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
      - id: versions
        run: echo versions="$(pnpm build --list-only)" >>"${GITHUB_OUTPUT}"

  docs:
    runs-on: ubuntu-24.04
    needs:
      - versions
    strategy:
      fail-fast: false
      matrix:
        # TODO: only build versions modified by the pull_request
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
      - run: pnpm build ${{ matrix.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}
          path: .vitepress/.versions/${{ matrix.version }}
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs:
      - docs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
      - run: mkdir .vitepress/.versions
      - uses: actions/download-artifact@v4
        with:
          path: .vitepress/.versions/
          pattern: "*"
      - run: pnpm build --merge-only
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  mod:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew build --stacktrace --warning-mode fail
        working-directory: reference
      - run: ./gradlew runDatagen --stacktrace --warning-mode fail
        working-directory: reference
      - if: failure()
        uses: FabricMCBot/publish-checkstyle-report@4627c82002aa370b6cb2a3140f34c7a8c55a5297
        with:
          reports: reference/**/build/reports/checkstyle/*.xml
      # require clean working directory
      - run: |
          readarray -d "" files < <(git ls-files --modified --others --exclude-standard -z)
          [[ ${#files[@]} -eq 0 ]] && exit 0
          for f in "${files[@]}"; do
            echo "::error file=${f},title=Datagen::Regenerate this file with 'cd reference && ./gradlew runDatagen'"
          done
          exit 1

  # #region automatic_testing_game_test_3
  client_game_test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew runProductionClientGameTest
        # #endregion automatic_testing_game_test_3
        working-directory: reference
        # #region automatic_testing_game_test_3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          path: build/run/clientGameTest/screenshots
        # #endregion automatic_testing_game_test_3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          path: reference/build/run/clientGameTest/screenshots

  deploy:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    needs:
      - merge
      - mod
      - client_game_test
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

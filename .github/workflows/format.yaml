name: Format

on:
  pull_request:
    paths-ignore:
      - .vitepress/sidebars/versioned/**
      - reference/*.*/**
      - reference/latest/src/main/generated/**
      - translated/**
      - versions/**
  workflow_dispatch:

concurrency:
  group: format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@58e6119fe4f3092a76a7771efb55e04d25b6b26f
        with:
          run_install: true
      # TODO: should we use pnpm exec markdownlint-cli2 for consistency? this should mean that we can remove the devDep markdownlint (replaced with markdownlint-cli2). Also, we should define these pnpm exec as scripts. in that case, we'll move the globs back here from .markdownlint-cli2.yaml
      - uses: FabricMCBot/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8
        with:
          config: .markdownlint-cli2.yaml

  prettier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@58e6119fe4f3092a76a7771efb55e04d25b6b26f
        with:
          run_install: true
      - run: pnpm exec prettier --write .
      - run: |
          readarray -d "" files < <(git ls-files --modified --others --exclude-standard -z)
          [[ ${#files[@]} -eq 0 ]] && exit 0
          for f in "${files[@]}"; do
            echo "::error file=${f},title=Prettier::Format this file with 'npx prettier --write \"${f}\"'"
          done
          exit 1

  stylelint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@58e6119fe4f3092a76a7771efb55e04d25b6b26f
        with:
          run_install: true
      - run: pnpm exec stylelint ".vitepress/theme/**/*.{css,vue}" "**/*.md"
